name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    permissions:
      contents: write
    runs-on: windows-latest
    outputs:
      display_version: ${{ steps.release_meta.outputs.display_version }}
      build_number: ${{ steps.release_meta.outputs.build_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Read and verify release metadata
        id: release_meta
        shell: pwsh
        run: |
          $release = Get-Content src/release-info.json -Raw | ConvertFrom-Json
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($release.buildNumber -notmatch '^\d+$' -or [int64]$release.buildNumber -lt 1) {
            throw "src/release-info.json buildNumber must be a positive integer"
          }
          $expectedUpdaterVersion = "0.0.$($release.buildNumber)"
          if ($tauriVersion -ne $expectedUpdaterVersion) {
            throw "Tauri updater version must be $expectedUpdaterVersion for build $($release.buildNumber), got $tauriVersion"
          }
          $latestUrl = "https://github.com/Lilislv/Setsuna/releases/latest/download/latest.json"
          $response = Invoke-WebRequest -Uri $latestUrl -SkipHttpErrorCheck
          if ($response.StatusCode -eq 200) {
            $latest = $response.Content | ConvertFrom-Json
            if ($latest.version -match '^0\.0\.(\d+)$' -and [int64]$release.buildNumber -le [int64]$Matches[1]) {
              throw "buildNumber $($release.buildNumber) must be greater than published build $($Matches[1])"
            }
          } elseif ($response.StatusCode -ne 404) {
            throw "Unable to verify latest published build: HTTP $($response.StatusCode)"
          }
          "display_version=$($release.displayVersion)" >> $env:GITHUB_OUTPUT
          "build_number=$($release.buildNumber)" >> $env:GITHUB_OUTPUT

      - name: Build signed Tauri release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --config src-tauri/tauri.release.conf.json
          tagName: ${{ github.ref_name }}
          releaseName: Setsuna ${{ steps.release_meta.outputs.display_version }}
          releaseBody: |
            Setsuna ${{ steps.release_meta.outputs.display_version }}
            Internal update build: ${{ steps.release_meta.outputs.build_number }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true

  build-linux:
    permissions:
      contents: write
    needs: build-windows
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libdbus-1-dev \
            libpipewire-0.3-dev \
            libxcb1-dev \
            libxcb-randr0-dev \
            libxcb-shm0-dev \
            libgbm-dev \
            libegl1-mesa-dev \
            libwayland-dev \
            libdrm-dev \
            liblzma-dev \
            clang \
            libclang-dev \
            patchelf \
            xdg-utils \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-libav \
            libgstreamer1.0-dev \
            build-essential \
            file \
            curl \
            wget

      - name: Install frontend dependencies
        run: npm ci

      - name: Build signed Tauri release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --config src-tauri/tauri.release.conf.json
          tagName: ${{ github.ref_name }}
          releaseName: Setsuna ${{ needs.build-windows.outputs.display_version }}
          releaseBody: |
            Setsuna ${{ needs.build-windows.outputs.display_version }}
            Internal update build: ${{ needs.build-windows.outputs.build_number }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
